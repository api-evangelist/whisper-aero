description: 'Whisper Aero is a Crossville, Tennessee based aerospace company developing
  ultra-quiet electric ducted-fan propulsion that converts electricity into thrust with roughly
  20 percent more efficiency and 20 dB less noise than conventional systems, scaling from 5 to 500
  pounds of thrust and 40 to 400 knots for aviation, defense, and commercial applications. Backed by
  Kindred Ventures, Lux Capital, and Menlo Ventures. The company is a hardware manufacturer and, as of
  this enrichment pass, publishes no public developer API, portal, or documentation surface.'
